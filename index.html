<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사운드 시각화 실험</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ① 안내 화면 -->
  <div id="screen-intro" class="screen active">
    <div class="intro-box">
      <div class="intro-label">연구 참여 안내</div>
      <h1 class="intro-title">사운드 청취<br>및 시각화 실험</h1>
      <div class="intro-meta">
        <span>서울대학교 미술대학 디자인과</span>
        <span class="dot">·</span>
        <span>총 24개 음원</span>
        <span class="dot">·</span>
        <span>약 40분 소요</span>
      </div>
      <div class="intro-description">
        <p>헤드폰을 착용한 후, 아래 버튼을 눌러 실험을 시작하세요.</p>
        <p>각 음원은 <strong>1분</strong>씩 재생됩니다.<br>
        소리를 들으며 떠오르는 시각적 심상을 태블릿에 자유롭게 그려 주세요.</p>
        <p class="note">정답은 없습니다. 직관적으로 느껴지는 대로 표현해 주세요.</p>
      </div>
      <button id="btn-start" class="btn-primary">실험 시작</button>
    </div>
  </div>

  <!-- ② 음원 재생 화면 -->
  <div id="screen-play" class="screen">
    <div class="play-header">
      <div class="progress-bar-wrap">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div class="play-counter">
        <span id="current-num">1</span>
        <span class="slash">/</span>
        <span>24</span>
      </div>
    </div>

    <div class="play-body">
      <div class="sound-number" id="sound-number">A01</div>
      <div class="waveform" id="waveform">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="timer-ring-wrap">
        <svg class="timer-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="52"/>
          <circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="52"/>
        </svg>
        <div class="timer-text" id="timer-text">1:00</div>
      </div>
    </div>

    <!-- 이전 / 다음 버튼 -->
    <div class="play-nav">
      <button id="btn-prev" class="nav-btn">← 이전 음원</button>
      <button id="btn-next" class="nav-btn nav-btn--next">다음 음원 →</button>
    </div>

    <audio id="audio-player" preload="auto"></audio>
  </div>

  <!-- ③ 전환 화면 -->
  <div id="screen-transition" class="screen">
    <div class="transition-box">
      <div class="transition-icon">↓</div>
      <div class="transition-msg">다음 음원으로 넘어가겠습니다</div>
      <div class="transition-countdown" id="transition-countdown">10</div>
      <div class="transition-next" id="transition-next"></div>
    </div>
  </div>

  <!-- ④ 종료 화면 -->
  <div id="screen-end" class="screen">
    <div class="end-box">
      <div class="end-check">✓</div>
      <h2 class="end-title">모든 음원 청취 완료</h2>
      <p class="end-desc">24개의 음원을 모두 청취하셨습니다.<br>연구자의 안내에 따라 다음 단계를 진행해 주세요.</p>
      <button id="btn-restart" class="btn-secondary">처음으로 돌아가기</button>
    </div>
  </div>

  <script src="sounds.js"></script>
  <script src="app.js"></script>
</body>
</html>
